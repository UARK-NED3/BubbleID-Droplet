[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bubbleid-droplet"
version = "0.1.0"
description = "BubbleID adaptation for droplet segmentation with tiled Detectron2 inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "scikit-image",
  "tifffile",
]

[project.optional-dependencies]
detectron2 = [
  "torch",
  "torchvision",
]

[project.scripts]
bubbleid-droplet = "bubbleid_droplet.cli:main"

[tool.setuptools.packages.find]
include = ["bubbleid_droplet*"]
